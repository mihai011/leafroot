[tool.ruff]

lint.select = [
    "E",     # pycodestyle (errors)
    "W",     # pycodestyle (warnings)
    "F",     # pyflakes
    "C90",   # mccabe complexity
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todos
    "ERA",   # eradicate (commented-out code)
    "PL",    # pylint rules
    "TRY",   # tryceratops
    "FLY",   # flynt (string formatting improvements)
    "NPY",   # NumPy-specific rules
    "PERF",  # performance improvements
    "FURB",  # refurb plugin
]
lint.ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"/leafroot/tests/*.py" = ["ARG001"]
"/leafroot/spark_apps/*.py" = ["S608"]
"/leafroot/data/alembic/*" = ["ALL"]

[tool.ruff.lint.isort]
case-sensitive = true
force-wrap-aliases = true
combine-as-imports = true

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
# McCabe complexity settings
[tool.ruff.lint.mccabe]
max-complexity = 10

# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.bandit]
exclude_dirs = ["tests", "scripts", "utils"]

[tool.poetry]
name = "leafroot"
version = "0.1.0"
description = "leaf root dependencies"
authors = ["mihai011 <mihaimihai011@gmail.com>"]
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["--import-mode=importlib"]

